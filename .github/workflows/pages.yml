name: Deploy CDM Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['video/**', '.github/workflows/video.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # tests first, then the database and the server functions, and only then the website,
  # so the live site never runs ahead of its server
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Courses are up to date
        run: node scripts/courses.mjs && git diff --exit-code src/lessons/courses.generated.ts supabase/seed/courses.sql
      - name: Every code lesson's model answer passes its checks (HTML, Python, SQL)
        run: npx playwright install --with-deps chromium && node scripts/check-lessons.mjs

  backend:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Database changes
        run: node scripts/apply-sql.mjs
      - name: Server functions
        run: npx --yes supabase@2 functions deploy --project-ref vkrnrupiidbnqxrehrty --use-api

  build:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
