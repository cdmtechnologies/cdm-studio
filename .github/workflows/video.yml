name: Make lesson videos (AI voice)

on:
  workflow_dispatch:
    inputs:
      scripts:
        description: 'Script modules in video/, comma separated (for example python_hello,python_values)'
        required: true
        default: python_values
      voice:
        description: 'Kokoro voice (am_michael is the chosen narrator)'
        required: true
        default: am_michael

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - id: l
        run: echo "list=$(echo '${{ inputs.scripts }}' | python3 -c 'import sys,json; print(json.dumps([s.strip() for s in sys.stdin.read().split(",") if s.strip()]))')" >> "$GITHUB_OUTPUT"

  video:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        script: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q "kokoro>=0.9.4" soundfile numpy
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Make the video
        run: |
          ./video/make.sh "${{ matrix.script }}" "${{ inputs.voice }}"
          mkdir -p dist && cp video/out/*-"${{ inputs.voice }}".mp4 video/out/*.srt dist/
      - name: Save it to its own branch (videos/<script>)
        run: |
          cd dist
          git init -q -b v && git config user.name 'cdm-video-bot' && git config user.email 'bot@users.noreply.github.com'
          git add . && git commit -qm "video ${{ matrix.script }} (${{ inputs.voice }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" v:videos/${{ matrix.script }}
